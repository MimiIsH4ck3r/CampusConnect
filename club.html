<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Details | CampusConnect</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/detail.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html">CampusConnect</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="clubs.html">Clubs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="events.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="news.html">News</a>
            </li>
            <li class="nav-item ms-lg-3">
              <button id="logout-button" class="btn btn-primary">Login</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container detail-container">
      <!-- Back link -->
      <a href="clubs.html" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to clubs
      </a>

      <!-- Club heading -->
      <section class="club-heading detail-panel">
        <div class="club-heading-main">
          <div class="detail-icon" id="club-icon"></div>

          <div>
            <span class="detail-category" id="club-category"> </span>
            <h1 id="club-name"></h1>

            <p id="club-short-description"></p>
          </div>
        </div>

        <button class="btn btn-primary join-button" id="join-club">
          <i class="fa-solid fa-plus"></i> Join Club
        </button>
      </section>

      <div class="detail-grid">
        <!-- Main content -->
        <div class="detail-main">
          <section class="detail-section">
            <h2>About the Club</h2>
            <p id="club-description"></p>
          </section>

          <section class="detail-section">
            <h2>What We Do</h2>

            <div class="activity-list" id="club-activities"></div>
          </section>
        </div>

        <!-- Sidebar -->
        <aside class="detail-sidebar">
          <section class="detail-panel sidebar-panel">
            <h2>Club Information</h2>

            <div class="info-item">
              <i class="fa-solid fa-user-group"></i>
              <div>
                <span>Members</span>
                <strong id="club-members"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-solid fa-calendar-week"></i>
              <div>
                <span>Meeting Schedule</span>
                <strong id="club-schedule"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-solid fa-location-dot"></i>
              <div>
                <span>Meeting Location</span>
                <strong id="club-location"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-solid fa-user"></i>
              <div>
                <span>Club Leader</span>
                <strong id="club-leader"></strong>
              </div>
            </div>
          </section>

          <section class="detail-panel sidebar-panel">
            <h2>Contact</h2>
            <p class="muted-text">
              Have questions? Get in touch with the club.
            </p>

            <a href="mailto:" class="contact-link" id="club-contact-email">
              <i class="fa-solid fa-envelope"></i> Contact Club
            </a>
          </section>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 CampusConnect. Connecting our school community.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase scripts go here, before the page-specific JS -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="./script/firebase-config.js"></script>
    <script src="./script/club.js"></script>
  </body>
</html>
