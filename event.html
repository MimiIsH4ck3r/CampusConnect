<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Details | CampusConnect</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/detail.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html">CampusConnect</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="clubs.html">Clubs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="events.html">Events</a>
            </li>
            <li class="nav-item ms-lg-3">
              <button id="logout-button" class="nav-link">Login</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container detail-container">
      <a href="events.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to events
      </a>

      <!-- Event banner -->
      <section class="event-banner detail-panel">
        <div class="event-cover" id="event-cover">
          <div class="cover-placeholder">
            <i class="fa-regular fa-calendar"></i>
            <span>Event cover image</span>
          </div>
        </div>

        <div class="event-heading">
          <span class="detail-category" id="event-category"> Technology </span>
          <h1 id="event-title"></h1>
          <p id="event-summary"></p>
        </div>
      </section>

      <div class="detail-grid event-grid">
        <!-- Main content -->
        <div class="detail-main">
          <section class="detail-section">
            <h2>About This Event</h2>

            <p id="event-description"></p>
          </section>

          <section class="detail-section">
            <h2>Event Schedule</h2>

            <div class="event-timeline" id="event-schedule"></div>
          </section>

          <section class="detail-section">
            <h2>Organizer</h2>

            <div class="organizer-info">
              <div class="organizer-icon">
                <i class="fa-solid fa-user-group"></i>
              </div>

              <div>
                <h3 id="event-organizer"></h3>
                <p class="muted-text">Event organizer</p>
              </div>
            </div>
          </section>
        </div>

        <!-- Registration sidebar -->
        <aside class="detail-sidebar">
          <section class="detail-panel sidebar-panel registration-panel">
            <span class="registration-status" id="event-status">
              Registration Open
            </span>

            <h2>Event Details</h2>

            <div class="info-item">
              <i class="fa-regular fa-calendar"></i>
              <div>
                <span>Date</span>
                <strong id="event-date"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-regular fa-clock"></i>
              <div>
                <span></span>
                <strong id="event-time"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-solid fa-location-dot"></i>
              <div>
                <span></span>
                <strong id="event-location"></strong>
              </div>
            </div>

            <div class="info-item">
              <i class="fa-solid fa-user-group"></i>
              <div>
                <span></span>
                <strong id="event-capacity"></strong>
              </div>
            </div>

            <button class="btn btn-primary register-button" id="register-event">
              Register Now
            </button>
          </section>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 CampusConnect. Connecting our school community.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="./script/firebase-config.js"></script>
    <script src="./script/guest.js"></script>
    <script src="./script/event.js"></script>
  </body>
</html>
