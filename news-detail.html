<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Story | CampusConnect</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/detail.css" />
    <link rel="stylesheet" href="./style/news.css" />
  </head>

  <body data-auth-required="true">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html">CampusConnect</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="clubs.html" data-auth-required>
                Clubs
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="events.html" data-auth-required>
                Events
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                href="news.html"
                data-auth-required
                aria-current="page"
              >
                News
              </a>
            </li>
            <li class="nav-item ms-lg-3">
              <button id="logout-button" class="nav-link btn" type="button">
                Login
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container detail-container news-detail-container">
      <a href="news.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to news
      </a>

      <p id="news-error" class="news-note" role="status" hidden></p>

      <article id="news-article" class="news-article detail-panel" hidden>
        <header class="news-article-header">
          <h1 id="news-title"></h1>
          <p id="news-summary" class="news-article-summary"></p>
          <div class="news-meta">
            <span id="news-author"></span>
            <span id="news-date"></span>
          </div>
        </header>
        <div class="news-article-content">
          <p id="news-content"></p>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 CampusConnect. Connecting our school community.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="./script/firebase-config.js"></script>
    <script src="./script/guest.js"></script>
    <script src="./script/news-detail.js"></script>
  </body>
</html>
